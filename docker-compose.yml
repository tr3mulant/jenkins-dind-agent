# Long-lived Jenkins inbound agent for the Dowscripts repo.
#
# Two services: the agent, and `dind` -- a private daemon it drives over TLS via
# DOCKER_HOST. Not the host's daemon: the controller shares this box, and host
# daemon access means reading $JENKINS_HOME and every credential in it.
#
# Outbound 443 only. Nothing publishes a host port, CI containers included --
# those bind inside dind's network namespace.
#
#   docker compose up -d --build
#
# Create the node in Jenkins FIRST (see README.md) for JENKINS_SECRET. Its
# labels must include the Jenkinsfile's `label 'php84'`, or the job queues
# forever instead of failing.

name: dowscripts-jenkins-agent

services:
  agent:
    build:
      context: .
      args:
        JENKINS_AGENT_TAG: ${JENKINS_AGENT_TAG:-latest-jdk21}
    image: dowscripts/jenkins-agent:${AGENT_IMAGE_TAG:-latest}
    container_name: dowscripts-jenkins-agent
    restart: unless-stopped
    # PID 1 reaping; this container is long-lived and forks freely.
    init: true

    environment:
      DOCKER_HOST: tcp://dind:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/client
      JENKINS_URL: ${JENKINS_URL:?set JENKINS_URL in .env}
      JENKINS_SECRET: ${JENKINS_SECRET:?copy the secret from the node page in Jenkins}
      JENKINS_AGENT_NAME: ${JENKINS_AGENT_NAME:-dowscripts-docker}
      JENKINS_AGENT_WORKDIR: /home/jenkins/agent
      # Tunnels the agent protocol over 443 instead of the TCP inbound port
      # (50000). Nothing extra to open.
      JENKINS_WEB_SOCKET: "true"

    volumes:
      # Workspaces. Named volume so uid 1000 owns it with no host chown.
      #
      # MUST STAY AT THIS PATH IN BOTH SERVICES. Compose resolves bind mounts on
      # the client and the daemon resolves them on its own filesystem, so if
      # dind can't see this path it mounts empty root-owned dirs into the test
      # containers -- silently, no error.
      - agent-workdir:/home/jenkins/agent

      # TLS client cert, generated by dind on first boot. Its entrypoint chmods
      # key.pem 0644 so a non-root client can read it.
      - docker-certs-client:/certs/client:ro

      # No composer/npm caches here -- neither runs on the agent. They run in
      # laravel.test, so any cache has to be mounted in web/compose.yaml.

    # No docker.sock mount or group_add on purpose -- DOCKER_HOST points at dind.
    # Don't restore them: DOCKER_HOST wins, so remounting the socket is a silent
    # no-op. Reverting to the host daemon also means unsetting the DOCKER_* vars
    # above, which gives any job root on the controller's box.

    # If the agent shares the controller's host, the public hostname has to
    # hairpin through the router, which many refuse -- the agent hangs on
    # connect while the URL works in a browser. Either:
    #
    #   a) pin the hostname to the host, keeping JENKINS_URL as-is:
    # extra_hosts:
    #   - "test.irongateenterprises.com:host-gateway"
    #
    #   b) bypass the proxy, with JENKINS_URL=http://host.docker.internal:8080/:
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

    networks:
      - agent

    # Holds agent.jar, git and the docker CLI only -- builds run under dind's
    # cgroup (see BUILD_MEM_LIMIT). Fixed, not tunable: this doesn't vary by
    # deployment. memswap pins swap; unset, Docker defaults it to 2x mem_limit.
    mem_limit: 512m
    memswap_limit: 512m
    depends_on:
      dind:
        condition: service_healthy

  dind:
    # Match the major to the docker-ce-cli the agent image installs.
    image: docker:29-dind
    container_name: dowscripts-jenkins-dind
    # Required by dockerd for cgroups, netfilter and its storage driver. Not a
    # security boundary -- privileged is escapable, as a mounted socket would
    # be. It only removes the casual path: no visibility into the controller's
    # containers or volumes. A separate agent host is the real fix.
    privileged: true
    restart: unless-stopped
    environment:
      DOCKER_TLS_CERTDIR: /certs
    volumes:
      # Generated on first boot; the agent mounts the client half :ro.
      - docker-certs-ca:/certs/ca
      - docker-certs-client:/certs/client

      # Layer store. A volume, or `compose down` discards the PHP layer cache.
      - docker-lib:/var/lib/docker

      # Same volume, same path as the agent. Load-bearing -- see the note there.
      - agent-workdir:/home/jenkins/agent
    networks:
      - agent

    # The real ceiling: every CI container is a child of this daemon. Size
    # BUILD_MEM_LIMIT against the server's RAM.
    mem_limit: ${BUILD_MEM_LIMIT:-6g}

    # Gates the agent's start until certs exist and dockerd is listening.
    # `docker info` needs no TLS here -- dockerd also listens on the local
    # socket. ~100s budget; cert generation plus startup is normally 5-15s.
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

# No database service on purpose: the suite runs on in-memory sqlite, so there
# is nothing to start and each run gets a clean schema. Safe because the app
# carries no Postgres-specific SQL (no DB::raw, jsonb, ILIKE or ON CONFLICT in
# app/, database/ or tests/).
#
# If that changes, add a throwaway postgres:18-alpine on the `agent` network
# with tmpfs storage. Do NOT point CI at web/compose.yaml's pgsql: 47 test files
# use RefreshDatabase, which migrates and truncates whatever connection it gets,
# and that one holds live runs, users and marketplace credentials.

networks:
  agent:
    driver: bridge

volumes:
  agent-workdir:
  docker-certs-ca:
  docker-certs-client:
  docker-lib:

# A long-lived Jenkins inbound agent plus a private Docker daemon to build on.
#
# One shared agent, many jobs: any Jenkinsfile whose `agent { label ... }`
# matches this node's labels runs here. Nothing in this stack is tied to a
# particular project -- what varies by host or project lives in .env.
#
# Two containers, siblings, not nested:
#
#   agent   agent.jar, git, docker CLI. Runs no containers itself.
#   dind    dockerd. Every container a pipeline starts is a child of this.
#
# The agent dials OUT to the controller, so the controller needs no route back
# and there is no inbound firewall rule -- including no port 50000, because
# JENKINS_WEB_SOCKET=true tunnels the agent protocol over 443.
#
# The host's own daemon is deliberately out of reach: if the controller shares
# this box, a job that could talk to the host socket could read $JENKINS_HOME
# and every credential in it.
#
#   docker compose up -d --build
#
# Create the node in Jenkins FIRST (see README.md); JENKINS_SECRET comes from
# that node's connection page.

name: ${STACK_NAME:-jenkins-dind-agent}

services:
  agent:
    build:
      context: .
      args:
        JENKINS_AGENT_TAG: ${JENKINS_AGENT_TAG:-latest-jdk21}
    image: ${AGENT_IMAGE:-jenkins-dind-agent}:${AGENT_IMAGE_TAG:-latest}
    container_name: ${STACK_NAME:-jenkins-dind-agent}-agent
    restart: unless-stopped
    # PID 1 reaping; this container is long-lived and forks freely.
    init: true

    environment:
      # tcp://docker, NOT tcp://dind, even though the service is named dind.
      #
      # dind generates its own server cert on first boot, and it does not know
      # what we named the service. The SANs it issues are fixed: the container
      # ID, the literal name `docker`, and localhost. Dialing tcp://dind:2376
      # therefore fails TLS hostname verification -- and it fails LATE, at the
      # first docker command in a build, not at container start:
      #
      #   x509: certificate is valid for 5c02f14a7fdc, docker, localhost,
      #   not dind
      #
      # The `docker` network alias on the dind service below is what makes this
      # name resolve. Keep the two together; changing either alone breaks CI.
      DOCKER_HOST: tcp://docker:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/client
      JENKINS_URL: ${JENKINS_URL:?set JENKINS_URL in .env}
      # No default. A wrong agent name fails as a node that never connects,
      # which is slower to diagnose than a missing variable.
      JENKINS_AGENT_NAME: ${JENKINS_AGENT_NAME:?must match the node name in Jenkins exactly}
      JENKINS_SECRET: ${JENKINS_SECRET:?copy the secret from the node page in Jenkins}
      JENKINS_AGENT_WORKDIR: /home/jenkins/agent
      # Tunnels the agent protocol over 443 instead of the TCP inbound port
      # (50000). Nothing extra to open.
      JENKINS_WEB_SOCKET: "true"

    volumes:
      # Workspaces. Named volume so uid 1000 owns it with no host chown.
      #
      # MUST STAY AT THIS PATH IN BOTH SERVICES. Compose resolves bind mounts on
      # the client and the daemon resolves them on its own filesystem, so if
      # dind can't see this path it mounts empty root-owned directories into
      # whatever containers a pipeline starts -- silently, no error. Any job
      # that bind-mounts its workspace (the common case) then fails in ways
      # that point nowhere near the cause.
      - agent-workdir:/home/jenkins/agent

      # TLS client cert, generated by dind on first boot. Its entrypoint chmods
      # key.pem 0644 so a non-root client can read it.
      - docker-certs-client:/certs/client:ro

      # No language or package caches here -- builds run in containers dind
      # starts, so a cache has to be mounted in the pipeline's own compose file.

    # No docker.sock mount or group_add on purpose -- DOCKER_HOST points at dind.
    # Don't restore them: DOCKER_HOST wins, so remounting the socket is a silent
    # no-op. Reverting to the host daemon also means unsetting the DOCKER_* vars
    # above, which gives any job root on the host.

    # Only if the agent runs on the CONTROLLER's own host: the public hostname
    # resolves to your public IP, so the container has to hairpin back through
    # the router, which many refuse. The agent hangs on connect while the URL
    # works fine in a browser. Either pin the hostname to the host, or bypass
    # the proxy with JENKINS_URL=http://host.docker.internal:8080/.
    #
    # extra_hosts:
    #   - "jenkins.example.com:host-gateway"
    #   - "host.docker.internal:host-gateway"

    networks:
      - agent

    # Holds agent.jar, git and the docker CLI only -- builds run under dind's
    # cgroup (see BUILD_MEM_LIMIT). Fixed, not tunable: this doesn't vary by
    # deployment. memswap pins swap; unset, Docker defaults it to 2x mem_limit.
    mem_limit: 512m
    memswap_limit: 512m
    depends_on:
      dind:
        condition: service_healthy

  dind:
    # Match the major to the docker-ce-cli the agent image installs.
    image: docker:${DIND_TAG:-29-dind}
    container_name: ${STACK_NAME:-jenkins-dind-agent}-dind
    # Required by dockerd for cgroups, netfilter and its storage driver. Not a
    # security boundary -- privileged is escapable, as a mounted socket would
    # be. It only removes the casual path: no visibility into the host's other
    # containers or volumes. A dedicated agent host is the real fix.
    privileged: true
    restart: unless-stopped
    environment:
      DOCKER_TLS_CERTDIR: /certs
    volumes:
      # Generated on first boot; the agent mounts the client half :ro.
      - docker-certs-ca:/certs/ca
      - docker-certs-client:/certs/client

      # Layer store. A volume, or `compose down -v` discards every cached layer
      # and the next build starts cold.
      - docker-lib:/var/lib/docker

      # Same volume, same path as the agent. Load-bearing -- see the note there.
      - agent-workdir:/home/jenkins/agent

      # Only if your registry uses a private or self-signed CA. This daemon is
      # new and trusts nothing the host daemon may already trust, so a push
      # fails with "x509: certificate signed by unknown authority".
      # - /etc/docker/certs.d:/etc/docker/certs.d:ro

    # The `docker` alias is load-bearing, not cosmetic.
    #
    # dind issues its own server cert at first boot with a fixed SAN list: the
    # container ID, the literal name `docker`, and localhost. It has no way to
    # know we named this service `dind`, so `dind` is not in that list and a
    # TLS-verifying client dialing tcp://dind:2376 is rejected:
    #
    #   x509: certificate is valid for 5c02f14a7fdc, docker, localhost, not dind
    #
    # Of the three names in the cert, only `docker` is usable from the agent --
    # localhost is a different container, and the container ID changes on every
    # recreate. Hence the alias, and hence DOCKER_HOST on the agent.
    #
    # Aliased rather than renamed so the stack still reads as agent + dind and
    # `docker compose logs dind` keeps working. The service name still resolves;
    # it just can't pass verification, so don't point clients at it.
    networks:
      agent:
        aliases:
          - docker

    # Only if pulls inside dind hang partway -- nested bridge networking on a
    # tunnelled link. Lower the MTU until they complete.
    # command: ["--mtu=1400"]

    # The real ceiling: every container any job starts is a child of this
    # daemon and counts against it. Size against this host's RAM, and remember
    # concurrent jobs share it.
    mem_limit: ${BUILD_MEM_LIMIT:-4g}

    # Gates the agent's start until dind is actually usable BY THE AGENT.
    #
    # This deliberately does not use the plain `docker info` that the local
    # socket answers. That check passed for a stack whose TLS name the agent
    # could not verify at all: dind reported (healthy), the agent started, and
    # every build failed minutes later on an x509 error that named neither the
    # cause nor the fix. A green healthcheck that doesn't test the path the
    # client uses is worse than no healthcheck.
    #
    # So dial the same way the agent does -- over TCP, by the `docker` alias,
    # with verification on, using the same client certs the agent mounts. If
    # this passes, the agent's first docker command will too.
    #
    # ~100s budget; cert generation plus startup is normally 5-15s.
    healthcheck:
      test: ["CMD-SHELL", "DOCKER_HOST=tcp://docker:2376 DOCKER_TLS_VERIFY=1 DOCKER_CERT_PATH=/certs/client docker info >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

networks:
  agent:
    driver: bridge

volumes:
  agent-workdir:
  docker-certs-ca:
  docker-certs-client:
  docker-lib:
